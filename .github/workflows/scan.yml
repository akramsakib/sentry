name: sentry-cycle
on:
  schedule:
    - cron: "*/10 * * * *"     # same cadence as the Mac build (CYCLE=300s ≈ 5-10 min)
  workflow_dispatch: {}          # "Run workflow" button = manual scan-now
  push:
    paths: ["sentry_core.py", "run_cycle.py", "broker.py", "config.json"]  # re-scan after code changes
permissions:
  contents: write                # commit state/journal back to this repo
concurrency:
  group: sentry-cycle            # never overlap runs — cron queue keeps ordering
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: run cycle
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python run_cycle.py
